name: roboshop
services:

  mongodb:
    build: ./mongodb
    image: manojkoneyagari/mongodb:2.0
    container_name: mongodb
    volumes:
    - mongodb:/data/db
  
  redis:
    image: redis:7
    container_name: redis  # docker run -d --name redis --network roboshop redis:7
    volumes:
    - redis:/data
  
  mysql:
    build: ./mysql   
    image: manojkoneyagari/mysql:2.0          # docker build -t manojkoneyagari/mysql:2.0
    container_name: mysql   # docker run -d --network roboshop manojkoneyagari/mysql:2.0
    command: --mysql-native-password=ON --innodb-lock_wait_timeout=120
    environment:
      MYSQL_ROOT_PASSWORD: "Roboshop@1"
    volumes:
    - mysql:/var/lib/mysql

  
  rabbitmq:
    image: rabbitmq:3
    container_name: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: "roboshop"
      RABBITMQ_DEFAULT_PASS: "roboshop123"
    volumes:
    - rabbitmq:/var/lib/rabbitmq

  catalogue:
    build: ./catalogue
    image: manojkoneyagari/catalogue:2.0
    container_name: catalogue
    depends_on:
      - mongodb

  user:
    build: ./user
    image: manojkoneyagari/user:2.0
    container_name: user
    depends_on:
      - mongodb
      - redis

  cart:
    build: ./cart
    image:  manojkoneyagari/cart:2.0
    container_name: cart
    depends_on:
      - catalogue
      - redis

  shipping:
    build: ./shipping
    image: manojkoneyagari/shipping:2.0
    container_name: shipping
    depends_on:
      - cart
      - mysql

  payment:
    build: ./payment
    image: manojkoneyagari/payment:2.0
    container_name: payment
    environment:
      CART_HOST: cart
      CART_PORT: 8080
      USER_HOST: user
      USER_PORT: 8080
      AMQP_HOST: rabbitmq
      AMQP_USER: roboshop
      AMQP_PASS: roboshop123

    depends_on:
      - cart
      - user
      - rabbitmq

  frontend:
    build: ./frontend
    image: manojkoneyagari/frontend:2.0
    container_name: frontend
    ports:
      - "80:80"
    depends_on:
      - catalogue
      - user
      - cart
      - shipping
      - payment

networks:
  default:  # this means all the services in this file use this network
    name: roboshop
    driver: bridge
    external: false  # if true it should be created manually, if false docker creates this network

volumes:
  mongodb:  # docker volume create mongodb
  redis:  # docker volume create redis
  mysql: # docker volume create mysql
  rabbitmq: # docker volume create rabbitmq
